<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Numbering System</title>
<link rel="manifest" href="manifest.json">
<style>
body{font-family:Arial;text-align:center;padding:20px;background:#f5f5f5}
.card{background:white;padding:20px;border-radius:15px;max-width:400px;margin:auto;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
input,button{width:90%;padding:12px;margin:8px;font-size:16px;border-radius:8px;border:1px solid #ccc}
button{background:#007bff;color:white;border:none;cursor:pointer}
button:active{background:#0056b3}
#result{margin-top:15px;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<div class="card">
<h2>Form Numbering System</h2>
<input id="start" type="number" placeholder="Enter start number">
<input id="count" type="number" placeholder="How many forms?">
<button onclick="generate()">Generate</button>
<div id="result"></div>
</div>
<script>
function generate(){
 let s=parseInt(document.getElementById('start').value);
 let c=parseInt(document.getElementById('count').value);
 if(isNaN(s)||isNaN(c)){document.getElementById('result').innerText="Please enter numbers";return;}
 let out="";
 for(let i=0;i<c;i++){ out+= (s+i) + "<br>"; }
 document.getElementById('result').innerHTML=out;
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
